# Deprecated compatibility filename. The unified dashboard uses a local
# session cookie, never a VITE_* operator key in the browser bundle.
# All published ports must remain bound to loopback. This is a trusted-PC
# profile, not public or individually authenticated multi-user access.
services:
  api:
    environment:
      LOCAL_DASHBOARD_MODE: "true"
      LOCAL_DASHBOARD_BIND_HOST: 127.0.0.1
