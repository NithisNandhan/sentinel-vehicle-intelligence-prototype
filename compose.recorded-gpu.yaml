# Optional NVIDIA acceleration. The default Compose profile stays CPU-only.
# The cached live image is sufficient: current source is mounted read-only.
services:
  recorded-analysis:
    image: ${RECORDED_GPU_IMAGE:-sentinel-prototype-edge-worker:latest}
    build:
      target: live
    command: ["python", "/workspace/tools/run_ocr_research.py", "-m", "sentinel_edge.live_detection_viewer",
              "--cache", "/models/experiments/awiros",
              "--checkpoint", "/models/experiments/awiros/adaptations/indian-corpus-encoder.safetensors",
              "--container-bind", "--device", "gpu", "--detector-profile", "${RECORDED_DETECTOR_PROFILE:-general}",
              "--recordings-dir", "/recordings", "--recordings-only", "--deliver", "--lifetime", "28800"]
    environment:
      SENTINEL_OCR_DEVICE: gpu
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
