name: sentinel-prototype

services:
  database:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/init-env.ps1 first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:${DB_PASSWORD}@database:5432/sentinel
      EDGE_API_KEY: ${EDGE_API_KEY:?Run scripts/init-env.ps1 first}
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:?Run scripts/init-env.ps1 first}
      WATCHLIST_HMAC_KEY: ${WATCHLIST_HMAC_KEY:?Run scripts/init-env.ps1 first}
      DEMO_MODE: ${DEMO_MODE:-true}
      CATALOGUE_GATEWAY_URL: http://catalogue-gateway:8765
      RECOGNITION_GATEWAY_URL: http://host.docker.internal:7780
      DASHBOARD_RECORDED_EVIDENCE: ${DASHBOARD_RECORDED_EVIDENCE:-false}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_MEDIA_PROXY_TARGET: http://mediamtx:8888
    ports:
      - 127.0.0.1:5173:5173
    depends_on:
      - api
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:1
    volumes:
      - ./media/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - 127.0.0.1:8554:8554
      - 127.0.0.1:8888:8888
      - 127.0.0.1:8889:8889
    restart: unless-stopped

  stream-adapter:
    build:
      context: .
      dockerfile: edge/Dockerfile
      target: live
    command: ["python", "-m", "sentinel_edge", "relay"]
    profiles: [online]
    environment:
      CENTRAL_API_URL: http://api:8000
      EDGE_API_KEY: ${EDGE_API_KEY:?Run scripts/init-env.ps1 first}
      WATCHLIST_HMAC_KEY: ${WATCHLIST_HMAC_KEY:?Run scripts/init-env.ps1 first}
      SENTINEL_EMAIL: ${SENTINEL_EMAIL:-}
      SENTINEL_PASSWORD: ${SENTINEL_PASSWORD:-}
      SENTINEL_COOKIE: ${SENTINEL_COOKIE:-}
      SENTINEL_BASE_URL: ${SENTINEL_BASE_URL:-https://cctv.corp8.cloud}
      SENTINEL_RTSP_HOST: ${SENTINEL_RTSP_HOST:-103.250.160.189}
      CAMERA_IDS: ${CAMERA_IDS:-}
      MEDIA_RELAY_BASE_URL: rtsp://mediamtx:8554
    depends_on:
      - mediamtx
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  stream-adapter-cpu:
    build:
      context: .
      dockerfile: edge/Dockerfile
      target: live
    command: ["python", "-m", "sentinel_edge", "relay"]
    profiles: [native]
    environment:
      CENTRAL_API_URL: http://api:8000
      EDGE_API_KEY: ${EDGE_API_KEY:?Run scripts/init-env.ps1 first}
      WATCHLIST_HMAC_KEY: ${WATCHLIST_HMAC_KEY:?Run scripts/init-env.ps1 first}
      SENTINEL_EMAIL: ${SENTINEL_EMAIL:-}
      SENTINEL_PASSWORD: ${SENTINEL_PASSWORD:-}
      SENTINEL_COOKIE: ${SENTINEL_COOKIE:-}
      SENTINEL_BASE_URL: ${SENTINEL_BASE_URL:-https://cctv.corp8.cloud}
      SENTINEL_RTSP_HOST: ${SENTINEL_RTSP_HOST:-103.250.160.189}
      CAMERA_IDS: ${CAMERA_IDS:-}
      MEDIA_RELAY_BASE_URL: rtsp://mediamtx:8554
    depends_on:
      - mediamtx
    restart: unless-stopped

  catalogue-gateway:
    build:
      context: .
      dockerfile: edge/Dockerfile
      target: live
    command: ["python", "-m", "sentinel_edge", "gateway"]
    profiles: [online]
    environment:
      EDGE_API_KEY: ${EDGE_API_KEY:?Run scripts/init-env.ps1 first}
      WATCHLIST_HMAC_KEY: ${WATCHLIST_HMAC_KEY:?Run scripts/init-env.ps1 first}
      SENTINEL_EMAIL: ${SENTINEL_EMAIL:-}
      SENTINEL_PASSWORD: ${SENTINEL_PASSWORD:-}
      SENTINEL_COOKIE: ${SENTINEL_COOKIE:-}
      SENTINEL_BASE_URL: ${SENTINEL_BASE_URL:-https://cctv.corp8.cloud}
      SENTINEL_RTSP_HOST: ${SENTINEL_RTSP_HOST:-103.250.160.189}
      MEDIAMTX_PUBLISH_URL: rtsp://mediamtx:8554
    depends_on:
      - mediamtx
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  catalogue-gateway-cpu:
    build:
      context: .
      dockerfile: edge/Dockerfile
      target: live
    command: ["python", "-m", "sentinel_edge", "gateway"]
    profiles: [native]
    environment:
      EDGE_API_KEY: ${EDGE_API_KEY:?Run scripts/init-env.ps1 first}
      WATCHLIST_HMAC_KEY: ${WATCHLIST_HMAC_KEY:?Run scripts/init-env.ps1 first}
      SENTINEL_EMAIL: ${SENTINEL_EMAIL:-}
      SENTINEL_PASSWORD: ${SENTINEL_PASSWORD:-}
      SENTINEL_COOKIE: ${SENTINEL_COOKIE:-}
      SENTINEL_BASE_URL: ${SENTINEL_BASE_URL:-https://cctv.corp8.cloud}
      SENTINEL_RTSP_HOST: ${SENTINEL_RTSP_HOST:-103.250.160.189}
      MEDIAMTX_PUBLISH_URL: rtsp://mediamtx:8554
    networks:
      default:
        aliases:
          - catalogue-gateway
    depends_on:
      - mediamtx
    restart: unless-stopped

  edge-worker:
    build:
      context: .
      dockerfile: edge/Dockerfile
      target: live
    command: ["python", "-m", "sentinel_edge", "live"]
    profiles: [online]
    environment:
      CENTRAL_API_URL: http://api:8000
      EDGE_API_KEY: ${EDGE_API_KEY:?Run scripts/init-env.ps1 first}
      EDGE_ID: region-demo-1
      WATCHLIST_HMAC_KEY: ${WATCHLIST_HMAC_KEY:?Run scripts/init-env.ps1 first}
      SENTINEL_EMAIL: ${SENTINEL_EMAIL:-}
      SENTINEL_PASSWORD: ${SENTINEL_PASSWORD:-}
      SENTINEL_COOKIE: ${SENTINEL_COOKIE:-}
      SENTINEL_BASE_URL: ${SENTINEL_BASE_URL:-https://cctv.corp8.cloud}
      SENTINEL_RTSP_HOST: ${SENTINEL_RTSP_HOST:-103.250.160.189}
      CAMERA_IDS: ${CAMERA_IDS:-}
      MEDIA_RELAY_BASE_URL: rtsp://mediamtx:8554
      EDGE_DB_PATH: /data/outbox.sqlite3
      MODEL_CACHE_DIR: /models
      PLATE_READER: ${PLATE_READER:-temporal-v2}
      HYBRID_ALIGNMENT: ${HYBRID_ALIGNMENT:-ecc}
      HYBRID_RESTORATION: ${HYBRID_RESTORATION:-false}
    volumes:
      - edge_data:/data
      - model_cache:/models
      - alpr_cache:/root/.cache
    depends_on:
      - api
      - stream-adapter
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Shared engineering session for permitted recorded footage, on CPU. It needs
  # no Sentinel credentials and no NVIDIA runtime. Put videos and their
  # receipts in ./data/recordings (see docs/RECORDED_VIDEO.md).
  recorded-analysis:
    build:
      context: .
      dockerfile: edge/Dockerfile
      target: live-cpu
    profiles: [recorded]
    working_dir: /workspace/edge
    command: ["python", "/workspace/tools/run_ocr_research.py", "-m", "sentinel_edge.live_detection_viewer",
              "--cache", "/models/experiments/awiros",
              "--checkpoint", "/models/experiments/awiros/adaptations/indian-corpus-encoder.safetensors",
              "--container-bind", "--device", "cpu", "--detector-profile", "${RECORDED_DETECTOR_PROFILE:-general}",
              "--recordings-dir", "/recordings", "--recordings-only", "--deliver", "--lifetime", "28800"]
    environment:
      CENTRAL_API_URL: http://api:8000
      EDGE_API_KEY: ${EDGE_API_KEY:?Run scripts/init-env.ps1 first}
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:?Run scripts/init-env.ps1 first}
      WATCHLIST_HMAC_KEY: ${WATCHLIST_HMAC_KEY:?Run scripts/init-env.ps1 first}
      EDGE_ID: region-demo-1
      EDGE_DB_PATH: /data/shared-recognition.sqlite3
      MODEL_CACHE_DIR: /models
      YOLO_CONFIG_DIR: /tmp/sentinel-yolo
      SENTINEL_OCR_DEVICE: cpu
      SENTINEL_CPU_THREADS: ${SENTINEL_CPU_THREADS:-4}
      SENTINEL_RECORDED_UNPACED: ${SENTINEL_RECORDED_UNPACED:-false}
      # Opt-in: show the analysed frame and full unverified readings of a
      # permitted recording in the operator dashboard. Never applies to cameras.
      SENTINEL_DASHBOARD_EVIDENCE: ${DASHBOARD_RECORDED_EVIDENCE:-false}
    volumes:
      - ./edge:/workspace/edge:ro
      - ./tools:/workspace/tools:ro
      - ./data/recordings:/recordings:ro
      - model_cache:/models:ro
      # Paddle creates ~/.cache/paddle on import, so ~/.cache itself must be
      # writable. Mount only the two weight folders, each read-only.
      - type: volume
        source: alpr_cache
        target: /root/.cache/open-image-models
        read_only: true
        volume:
          subpath: open-image-models
      - type: volume
        source: alpr_cache
        target: /root/.cache/fast-plate-ocr
        read_only: true
        volume:
          subpath: fast-plate-ocr
      - shared_recognition:/data
    ports:
      - 127.0.0.1:7780:7780
    depends_on:
      - api
    restart: unless-stopped

  demo-simulator:
    build:
      context: .
      dockerfile: edge/Dockerfile
      target: offline
    command: ["python", "-m", "sentinel_edge", "simulate"]
    profiles: [offline]
    environment:
      CENTRAL_API_URL: http://api:8000
      EDGE_API_KEY: ${EDGE_API_KEY:?Run scripts/init-env.ps1 first}
      EDGE_ID: region-demo-1
      WATCHLIST_HMAC_KEY: ${WATCHLIST_HMAC_KEY:?Run scripts/init-env.ps1 first}
      EDGE_DB_PATH: /data/outbox.sqlite3
    volumes:
      - demo_edge_data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  edge_data:
  demo_edge_data:
  model_cache:
  alpr_cache:
  # Same queue volume the live engineering launcher and the handoff restore use.
  # External so `docker compose down -v` can never delete undelivered events.
  # scripts/start-recorded-analysis.ps1 creates it if it does not exist.
  shared_recognition:
    name: sentinel_shared_recognition
    external: true

