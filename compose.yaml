name: sentinel-prototype

services:
  database:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/init-env.ps1 first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:${DB_PASSWORD}@database:5432/sentinel
      EDGE_API_KEY: ${EDGE_API_KEY:?Run scripts/init-env.ps1 first}
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:?Run scripts/init-env.ps1 first}
      WATCHLIST_HMAC_KEY: ${WATCHLIST_HMAC_KEY:?Run scripts/init-env.ps1 first}
      DEMO_MODE: ${DEMO_MODE:-true}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_MEDIA_PROXY_TARGET: http://mediamtx:8888
    ports:
      - 127.0.0.1:5173:5173
    depends_on:
      - api
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:1
    volumes:
      - ./media/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - 127.0.0.1:8554:8554
      - 127.0.0.1:8888:8888
      - 127.0.0.1:8889:8889
    restart: unless-stopped

  stream-adapter:
    build:
      context: .
      dockerfile: edge/Dockerfile
      target: live
    command: ["python", "-m", "sentinel_edge", "relay"]
    profiles: [online]
    environment:
      CENTRAL_API_URL: http://api:8000
      EDGE_API_KEY: ${EDGE_API_KEY:?Run scripts/init-env.ps1 first}
      WATCHLIST_HMAC_KEY: ${WATCHLIST_HMAC_KEY:?Run scripts/init-env.ps1 first}
      SENTINEL_EMAIL: ${SENTINEL_EMAIL:-}
      SENTINEL_PASSWORD: ${SENTINEL_PASSWORD:-}
      SENTINEL_COOKIE: ${SENTINEL_COOKIE:-}
      SENTINEL_BASE_URL: ${SENTINEL_BASE_URL:-https://cctv.corp8.cloud}
      CAMERA_IDS: ${CAMERA_IDS:-}
      MEDIA_RELAY_BASE_URL: rtsp://mediamtx:8554
    depends_on:
      - mediamtx
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  stream-adapter-cpu:
    build:
      context: .
      dockerfile: edge/Dockerfile
      target: live
    command: ["python", "-m", "sentinel_edge", "relay"]
    profiles: [native]
    environment:
      CENTRAL_API_URL: http://api:8000
      EDGE_API_KEY: ${EDGE_API_KEY:?Run scripts/init-env.ps1 first}
      WATCHLIST_HMAC_KEY: ${WATCHLIST_HMAC_KEY:?Run scripts/init-env.ps1 first}
      SENTINEL_EMAIL: ${SENTINEL_EMAIL:-}
      SENTINEL_PASSWORD: ${SENTINEL_PASSWORD:-}
      SENTINEL_COOKIE: ${SENTINEL_COOKIE:-}
      SENTINEL_BASE_URL: ${SENTINEL_BASE_URL:-https://cctv.corp8.cloud}
      CAMERA_IDS: ${CAMERA_IDS:-}
      MEDIA_RELAY_BASE_URL: rtsp://mediamtx:8554
    depends_on:
      - mediamtx
    restart: unless-stopped

  edge-worker:
    build:
      context: .
      dockerfile: edge/Dockerfile
      target: live
    command: ["python", "-m", "sentinel_edge", "live"]
    profiles: [online]
    environment:
      CENTRAL_API_URL: http://api:8000
      EDGE_API_KEY: ${EDGE_API_KEY:?Run scripts/init-env.ps1 first}
      EDGE_ID: region-demo-1
      WATCHLIST_HMAC_KEY: ${WATCHLIST_HMAC_KEY:?Run scripts/init-env.ps1 first}
      SENTINEL_EMAIL: ${SENTINEL_EMAIL:-}
      SENTINEL_PASSWORD: ${SENTINEL_PASSWORD:-}
      SENTINEL_COOKIE: ${SENTINEL_COOKIE:-}
      SENTINEL_BASE_URL: ${SENTINEL_BASE_URL:-https://cctv.corp8.cloud}
      CAMERA_IDS: ${CAMERA_IDS:-}
      MEDIA_RELAY_BASE_URL: rtsp://mediamtx:8554
      EDGE_DB_PATH: /data/outbox.sqlite3
      MODEL_CACHE_DIR: /models
    volumes:
      - edge_data:/data
      - model_cache:/models
    depends_on:
      - api
      - stream-adapter
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  demo-simulator:
    build:
      context: .
      dockerfile: edge/Dockerfile
      target: offline
    command: ["python", "-m", "sentinel_edge", "simulate"]
    profiles: [offline]
    environment:
      CENTRAL_API_URL: http://api:8000
      EDGE_API_KEY: ${EDGE_API_KEY:?Run scripts/init-env.ps1 first}
      EDGE_ID: region-demo-1
      WATCHLIST_HMAC_KEY: ${WATCHLIST_HMAC_KEY:?Run scripts/init-env.ps1 first}
      EDGE_DB_PATH: /data/outbox.sqlite3
    volumes:
      - demo_edge_data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  edge_data:
  demo_edge_data:
  model_cache:

